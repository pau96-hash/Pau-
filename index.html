<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Facturación</title>
<style>
  :root {
    --bg: #f5f6f8; --panel: #fff; --text: #1d2330; --muted: #6b7280;
    --line: #e3e6eb; --accent: #2457c5; --accent-2: #e8eefb;
    --ok: #157f3b; --ok-bg: #e5f5ea; --warn: #9a6200; --warn-bg: #fdf3dc;
    --bad: #b42318; --bad-bg: #fde8e6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b; --panel: #1b2029; --text: #e7eaf0; --muted: #9aa3b2;
      --line: #2c3340; --accent: #7aa2ff; --accent-2: #24304a;
      --ok: #6fd08f; --ok-bg: #173323; --warn: #f2c063; --warn-bg: #3a2e12;
      --bad: #ff8a80; --bad-bg: #3d1d1b;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); }
  header { background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
  .bar { max-width: 1100px; margin: 0 auto; padding: 10px 16px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  .brand { font-weight: 700; font-size: 17px; margin-right: auto; }
  nav { display: flex; gap: 4px; flex-wrap: wrap; }
  nav button { background: none; border: 0; color: var(--muted); padding: 8px 12px; border-radius: 8px; cursor: pointer; font: inherit; }
  nav button.on { background: var(--accent-2); color: var(--accent); font-weight: 600; }
  main { max-width: 1100px; margin: 0 auto; padding: 20px 16px 60px; }
  h1 { font-size: 22px; margin: 0 0 16px; }
  h2 { font-size: 16px; margin: 0 0 12px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: end; }
  .row > * { flex: 1 1 180px; }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  input, select, textarea { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--text); font: inherit; }
  textarea { min-height: 60px; resize: vertical; }
  button.btn { border: 1px solid var(--line); background: var(--panel); color: var(--text); padding: 8px 14px; border-radius: 8px; cursor: pointer; font: inherit; white-space: nowrap; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  @media (prefers-color-scheme: dark) { button.primary { color: #0d1424; } }
  button.danger { color: var(--bad); }
  button.small { padding: 4px 10px; font-size: 13px; }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
  .toolbar .grow { flex: 1 1 200px; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  th { font-size: 12px; color: var(--muted); font-weight: 600; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  tr.click { cursor: pointer; }
  tr.click:hover td { background: var(--accent-2); }
  .tag { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 12px; font-weight: 600; }
  .tag.pagada { background: var(--ok-bg); color: var(--ok); }
  .tag.pendiente { background: var(--warn-bg); color: var(--warn); }
  .tag.vencida, .tag.anulada { background: var(--bad-bg); color: var(--bad); }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
  .stat .k { font-size: 12px; color: var(--muted); }
  .stat .v { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .lines td { padding: 4px; }
  .lines input { padding: 6px 8px; }
  .totals { margin-left: auto; max-width: 340px; }
  .totals div { display: flex; justify-content: space-between; padding: 4px 0; font-variant-numeric: tabular-nums; }
  .totals .grand { font-weight: 700; font-size: 18px; border-top: 2px solid var(--text); margin-top: 6px; padding-top: 8px; }
  .muted { color: var(--muted); }
  .empty { text-align: center; color: var(--muted); padding: 30px; }
  .note { font-size: 13px; color: var(--muted); }

  /* Documento de factura (pantalla e impresión) */
  .doc { background: #fff; color: #111; max-width: 820px; margin: 0 auto; padding: 40px; border-radius: 4px; box-shadow: 0 2px 12px rgba(0,0,0,.12); font-size: 13px; }
  .doc h1 { font-size: 26px; margin: 0; color: #111; }
  .doc .head { display: flex; justify-content: space-between; gap: 20px; margin-bottom: 28px; }
  .doc .parties { display: flex; gap: 20px; margin-bottom: 24px; }
  .doc .parties > div { flex: 1; background: #f4f5f7; padding: 12px; border-radius: 6px; }
  .doc .lbl { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: #666; margin-bottom: 4px; }
  .doc table th { color: #555; border-bottom: 2px solid #111; }
  .doc table td { border-bottom: 1px solid #ddd; }
  .doc .totals .grand { border-top-color: #111; }
  .doc .foot { margin-top: 28px; font-size: 12px; color: #444; white-space: pre-wrap; }
  @media print {
    @page { margin: 14mm; }
    body { background: #fff; }
    header, .no-print { display: none !important; }
    main { padding: 0; max-width: none; }
    .doc { box-shadow: none; padding: 0; max-width: none; }
  }
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="brand" id="brand">Facturación</div>
    <nav id="nav">
      <button data-v="facturas">Facturas</button>
      <button data-v="gastos">Gastos</button>
      <button data-v="clientes">Clientes</button>
      <button data-v="productos">Productos</button>
      <button data-v="resumen">Resumen</button>
      <button data-v="ajustes">Mis datos</button>
    </nav>
  </div>
</header>
<main id="app"></main>

<script>
"use strict";
/* ================= Datos ================= */
const KEY = "facturacion-v1";
const hoy = () => new Date().toISOString().slice(0, 10);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

function nuevoEstado() {
  return {
    empresa: { nombre: "", nif: "", direccion: "", cp: "", ciudad: "", provincia: "", email: "", telefono: "",
               iban: "", serie: "F", ivaDefecto: 21, irpfDefecto: 15, diasVencimiento: 30,
               pie: "Forma de pago: transferencia bancaria.", inicios: {} },
    clientes: [], productos: [], facturas: [], gastos: []
  };
}
function normalizar(d) {
  const n = Object.assign(nuevoEstado(), d);
  n.empresa = Object.assign(nuevoEstado().empresa, d.empresa);
  n.empresa.inicios = n.empresa.inicios || {};
  ["clientes", "productos", "facturas", "gastos"].forEach(k => { if (!Array.isArray(n[k])) n[k] = []; });
  return n;
}
let db;
try { db = normalizar(JSON.parse(localStorage.getItem(KEY)) || {}); } catch (e) { db = nuevoEstado(); }
function guardar() {
  try { localStorage.setItem(KEY, JSON.stringify(db)); }
  catch (e) { alert("No se han podido guardar los datos en este navegador. Exporta una copia de seguridad."); }
}

/* ================= Utilidades ================= */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const r2 = n => { n = Number(n) || 0; return Math.sign(n) * Math.round((Math.abs(n) + Number.EPSILON) * 100) / 100; };
const CATEGORIAS = ["Suministros (luz, agua, gas)", "Teléfono e internet", "Alquiler", "Material y compras", "Software y servicios",
  "Gestoría y asesoría", "Seguros", "Cuota de autónomos", "Transporte y vehículo", "Dietas", "Formación", "Publicidad", "Comisiones bancarias", "Otros"];
const num = v => { const n = parseFloat(String(v).replace(",", ".")); return isFinite(n) ? n : 0; };
const eur = n => new Intl.NumberFormat("es-ES", { style: "currency", currency: "EUR" }).format(n || 0);
const fecha = s => s ? s.split("-").reverse().join("/") : "";
const $ = s => document.querySelector(s);
const sumarDias = (iso, d) => { const f = new Date(iso + "T12:00:00"); f.setDate(f.getDate() + Number(d || 0)); return f.toISOString().slice(0, 10); };

function codigo(f) { return `${f.serie}${f.fecha.slice(0, 4)}-${String(f.numero).padStart(4, "0")}`; }
function siguienteNumero(serie, anio) {
  const nums = db.facturas.filter(f => f.serie === serie && f.fecha.slice(0, 4) === anio).map(f => f.numero);
  const inicio = Number(db.empresa.inicios[serie + anio]) || 1;
  return Math.max(inicio, nums.length ? Math.max(...nums) + 1 : 1);
}
function calcular(f) {
  const porIva = {};
  let base = 0;
  for (const l of f.lineas) {
    const b = r2(num(l.cantidad) * num(l.precio) * (1 - num(l.descuento) / 100));
    base += b;
    const k = String(num(l.iva));
    porIva[k] = r2((porIva[k] || 0) + b);
  }
  base = r2(base);
  const desglose = Object.keys(porIva).sort((a, b) => b - a).map(k => ({ iva: num(k), base: porIva[k], cuota: r2(porIva[k] * num(k) / 100) }));
  const iva = r2(desglose.reduce((s, d) => s + d.cuota, 0));
  const irpf = r2(base * num(f.irpf) / 100);
  return { base, desglose, iva, irpf, total: r2(base + iva - irpf) };
}
function estadoDe(f) {
  if (f.estado === "pendiente" && f.vencimiento && f.vencimiento < hoy()) return "vencida";
  return f.estado;
}
const etiqueta = { pagada: "Pagada", pendiente: "Pendiente", vencida: "Vencida", anulada: "Anulada" };

/* ================= Navegación ================= */
let vista = "facturas", param = null;
function ir(v, p = null) { vista = v; param = p; render(); window.scrollTo(0, 0); }
$("#nav").addEventListener("click", e => { if (e.target.dataset.v) ir(e.target.dataset.v); });

function render() {
  document.querySelectorAll("#nav button").forEach(b => b.classList.toggle("on", b.dataset.v === vista || (vista.startsWith("factura") && b.dataset.v === "facturas")));
  $("#brand").textContent = db.empresa.nombre ? db.empresa.nombre + " · Facturación" : "Facturación";
  const app = $("#app");
  ({ facturas: vFacturas, factura: vEditar, ver: vVer, gastos: vGastos, clientes: vClientes, productos: vProductos, resumen: vResumen, ajustes: vAjustes })[vista](app);
}

/* ================= Vista: lista de facturas ================= */
let filtro = { texto: "", estado: "", anio: String(new Date().getFullYear()) };
function vFacturas(app) {
  if (!db.empresa.nombre || !db.empresa.nif) {
    app.innerHTML = `<div class="card"><h2>Bienvenido</h2><p>Antes de emitir facturas, rellena tus datos fiscales (nombre, NIF, dirección).</p>
      <button class="btn primary" onclick="ir('ajustes')">Rellenar mis datos</button></div>`;
    return;
  }
  const anios = [...new Set(db.facturas.map(f => f.fecha.slice(0, 4)).concat(String(new Date().getFullYear())))].sort().reverse();
  const lista = db.facturas.filter(f => {
    if (filtro.anio && f.fecha.slice(0, 4) !== filtro.anio) return false;
    if (filtro.estado && estadoDe(f) !== filtro.estado) return false;
    const t = filtro.texto.toLowerCase();
    return !t || codigo(f).toLowerCase().includes(t) || (f.cliente.nombre || "").toLowerCase().includes(t);
  }).sort((a, b) => (b.fecha + String(b.numero).padStart(6, "0")).localeCompare(a.fecha + String(a.numero).padStart(6, "0")));

  const activas = lista.filter(f => f.estado !== "anulada");
  const tot = activas.reduce((s, f) => s + calcular(f).total, 0);
  const pend = activas.filter(f => f.estado === "pendiente").reduce((s, f) => s + calcular(f).total, 0);
  const venc = activas.filter(f => estadoDe(f) === "vencida");

  app.innerHTML = `
    <div class="toolbar"><h1 style="margin:0;margin-right:auto">Facturas</h1>
      <button class="btn primary" onclick="ir('factura')">+ Nueva factura</button></div>
    <div class="stats">
      <div class="stat"><div class="k">Facturado (filtro)</div><div class="v">${eur(tot)}</div></div>
      <div class="stat"><div class="k">Pendiente de cobro</div><div class="v">${eur(pend)}</div></div>
      <div class="stat"><div class="k">Facturas vencidas</div><div class="v">${venc.length}</div></div>
      <div class="stat"><div class="k">Nº de facturas</div><div class="v">${activas.length}</div></div>
    </div>
    <div class="card">
      <div class="toolbar">
        <input class="grow" id="fTexto" placeholder="Buscar por número o cliente…" value="${esc(filtro.texto)}">
        <select id="fAnio" style="width:auto"><option value="">Todos los años</option>${anios.map(a => `<option ${a === filtro.anio ? "selected" : ""}>${a}</option>`).join("")}</select>
        <select id="fEstado" style="width:auto"><option value="">Todos los estados</option>${Object.keys(etiqueta).map(k => `<option value="${k}" ${k === filtro.estado ? "selected" : ""}>${etiqueta[k]}</option>`).join("")}</select>
      </div>
      ${lista.length ? `<div class="table-wrap"><table>
        <thead><tr><th>Número</th><th>Fecha</th><th>Cliente</th><th class="num">Base</th><th class="num">Total</th><th>Estado</th></tr></thead>
        <tbody>${lista.map(f => { const c = calcular(f), e = estadoDe(f); return `
          <tr class="click" data-id="${f.id}"><td><b>${codigo(f)}</b></td><td>${fecha(f.fecha)}</td><td>${esc(f.cliente.nombre)}</td>
          <td class="num">${eur(c.base)}</td><td class="num"><b>${eur(c.total)}</b></td><td><span class="tag ${e}">${etiqueta[e]}</span></td></tr>`; }).join("")}
        </tbody></table></div>` : `<div class="empty">No hay facturas${db.facturas.length ? " con estos filtros" : " todavía. Crea la primera con «Nueva factura»"}.</div>`}
    </div>`;
  $("#fTexto").oninput = e => { filtro.texto = e.target.value; const p = e.target.selectionStart; vFacturas(app); const i = $("#fTexto"); i.focus(); i.setSelectionRange(p, p); };
  $("#fAnio").onchange = e => { filtro.anio = e.target.value; vFacturas(app); };
  $("#fEstado").onchange = e => { filtro.estado = e.target.value; vFacturas(app); };
  app.querySelectorAll("tr.click").forEach(tr => tr.onclick = () => ir("ver", tr.dataset.id));
}

/* ================= Vista: crear / editar factura ================= */
let borrador = null;
function vEditar(app) {
  const E = db.empresa;
  if (!borrador || borrador._para !== param) {
    const orig = param && db.facturas.find(f => f.id === param);
    borrador = orig ? JSON.parse(JSON.stringify(orig)) : {
      id: null, serie: E.serie || "F", numero: null, fecha: hoy(), vencimiento: sumarDias(hoy(), E.diasVencimiento),
      clienteId: "", cliente: { nombre: "", nif: "", direccion: "", email: "" },
      lineas: [{ concepto: "", cantidad: 1, precio: 0, descuento: 0, iva: E.ivaDefecto }],
      irpf: E.irpfDefecto, estado: "pendiente", notas: ""
    };
    borrador._para = param;
  }
  const f = borrador;
  const numeroPrevisto = f.id ? codigo(f) : codigo({ ...f, numero: siguienteNumero(f.serie, f.fecha.slice(0, 4)) });

  app.innerHTML = `
    <div class="toolbar"><h1 style="margin:0;margin-right:auto">${f.id ? "Editar" : "Nueva"} factura <span class="muted">${numeroPrevisto}</span></h1>
      <button class="btn" onclick="borrador=null; ${f.id ? `ir('ver','${f.id}')` : "ir('facturas')"}">Cancelar</button>
      <button class="btn primary" id="guardarF">Guardar factura</button></div>
    ${f.rectifica ? `<div class="card" style="border-color:var(--warn);background:var(--warn-bg)"><b>Factura rectificativa</b> de la ${esc(f.rectifica.codigo)} (${fecha(f.rectifica.fecha)}).
      <span class="note">Las líneas van en negativo para anular la original. Si solo corriges una parte, deja únicamente la diferencia. Indica el motivo en las notas.</span></div>` : ""}
    <div class="card"><div class="row">
      <div><label>Serie</label><input id="serie" value="${esc(f.serie)}" ${f.id ? "disabled" : ""}></div>
      <div><label>Fecha de emisión</label><input type="date" id="fecha" value="${f.fecha}" ${f.id ? "disabled" : ""}></div>
      <div><label>Vencimiento</label><input type="date" id="venc" value="${f.vencimiento || ""}"></div>
      <div><label>Estado</label><select id="estado">${["pendiente", "pagada", "anulada"].map(k => `<option value="${k}" ${k === f.estado ? "selected" : ""}>${etiqueta[k]}</option>`).join("")}</select></div>
    </div></div>
    <div class="card"><h2>Cliente</h2>
      <div class="row" style="margin-bottom:12px"><div><label>Elegir cliente guardado</label>
        <select id="selCli"><option value="">— Escribir datos a mano —</option>${db.clientes.slice().sort((a, b) => a.nombre.localeCompare(b.nombre)).map(c => `<option value="${c.id}" ${c.id === f.clienteId ? "selected" : ""}>${esc(c.nombre)}</option>`).join("")}</select></div></div>
      <div class="row">
        <div><label>Nombre / Razón social *</label><input id="cNombre" value="${esc(f.cliente.nombre)}"></div>
        <div><label>NIF / CIF</label><input id="cNif" value="${esc(f.cliente.nif)}"></div>
        <div style="flex-basis:100%"><label>Dirección</label><input id="cDir" value="${esc(f.cliente.direccion)}"></div>
        <div><label>Email</label><input id="cEmail" value="${esc(f.cliente.email)}"></div>
        <div style="flex:0 0 auto"><label>&nbsp;</label><label style="display:flex;gap:6px;align-items:center;font-size:13px;color:var(--text)"><input type="checkbox" id="cGuardar" style="width:auto"> Guardar en clientes</label></div>
      </div></div>
    <div class="card"><h2>Conceptos</h2>
      <div class="table-wrap"><table class="lines"><thead><tr><th style="min-width:220px">Concepto</th><th class="num" style="width:90px">Cant.</th><th class="num" style="width:110px">Precio €</th><th class="num" style="width:80px">Dto. %</th><th class="num" style="width:90px">IVA %</th><th class="num" style="width:110px">Importe</th><th></th></tr></thead>
      <tbody id="lineas"></tbody></table></div>
      <datalist id="dlProd">${db.productos.map(p => `<option value="${esc(p.nombre)}">`).join("")}</datalist>
      <div class="toolbar" style="margin-top:10px"><button class="btn small" id="addL">+ Añadir línea</button>
        <span class="note">Consejo: si escribes el nombre de un producto guardado, se rellena el precio y el IVA.</span></div>
      <div class="row" style="align-items:start;margin-top:8px">
        <div style="max-width:200px"><label>Retención IRPF %</label><input id="irpf" inputmode="decimal" value="${f.irpf}"></div>
        <div class="totals" id="totales"></div>
      </div></div>
    <div class="card"><label>Notas / observaciones (aparecen en la factura)</label><textarea id="notas">${esc(f.notas)}</textarea></div>`;

  const pintarLineas = () => {
    $("#lineas").innerHTML = f.lineas.map((l, i) => `<tr>
      <td><input data-i="${i}" data-k="concepto" list="dlProd" value="${esc(l.concepto)}"></td>
      <td><input data-i="${i}" data-k="cantidad" class="num" inputmode="decimal" value="${l.cantidad}"></td>
      <td><input data-i="${i}" data-k="precio" inputmode="decimal" value="${l.precio}"></td>
      <td><input data-i="${i}" data-k="descuento" inputmode="decimal" value="${l.descuento}"></td>
      <td><select data-i="${i}" data-k="iva">${[21, 10, 4, 0].concat([num(l.iva)]).filter((v, j, a) => a.indexOf(v) === j).map(v => `<option ${v === num(l.iva) ? "selected" : ""}>${v}</option>`).join("")}</select></td>
      <td class="num" id="imp${i}"></td>
      <td><button class="btn small danger" data-del="${i}" title="Quitar línea">✕</button></td></tr>`).join("");
    pintarTotales();
  };
  const pintarTotales = () => {
    f.lineas.forEach((l, i) => { const c = $("#imp" + i); if (c) c.textContent = eur(r2(num(l.cantidad) * num(l.precio) * (1 - num(l.descuento) / 100))); });
    const c = calcular(f);
    $("#totales").innerHTML = `<div><span>Base imponible</span><span>${eur(c.base)}</span></div>
      ${c.desglose.map(d => `<div><span>IVA ${d.iva}% <span class="muted">s/ ${eur(d.base)}</span></span><span>${eur(d.cuota)}</span></div>`).join("")}
      ${c.irpf ? `<div><span>Retención IRPF ${num(f.irpf)}%</span><span>−${eur(c.irpf)}</span></div>` : ""}
      <div class="grand"><span>TOTAL</span><span>${eur(c.total)}</span></div>`;
  };
  pintarLineas();

  $("#lineas").addEventListener("input", e => {
    const { i, k } = e.target.dataset; if (i === undefined) return;
    f.lineas[i][k] = e.target.value;
    if (k === "concepto") {
      const p = db.productos.find(p => p.nombre === e.target.value);
      if (p) { f.lineas[i].precio = p.precio; f.lineas[i].iva = p.iva; pintarLineas(); const inp = $(`[data-i="${i}"][data-k="cantidad"]`); inp && inp.focus(); return; }
    }
    pintarTotales();
  });
  $("#lineas").addEventListener("change", e => { if (e.target.tagName === "SELECT") { f.lineas[e.target.dataset.i].iva = num(e.target.value); pintarTotales(); } });
  $("#lineas").addEventListener("click", e => {
    if (e.target.dataset.del === undefined) return;
    f.lineas.splice(+e.target.dataset.del, 1);
    if (!f.lineas.length) f.lineas.push({ concepto: "", cantidad: 1, precio: 0, descuento: 0, iva: E.ivaDefecto });
    pintarLineas();
  });
  $("#addL").onclick = () => { f.lineas.push({ concepto: "", cantidad: 1, precio: 0, descuento: 0, iva: E.ivaDefecto }); pintarLineas(); $(`[data-i="${f.lineas.length - 1}"][data-k="concepto"]`).focus(); };
  $("#irpf").oninput = e => { f.irpf = e.target.value; pintarTotales(); };
  $("#selCli").onchange = e => {
    const c = db.clientes.find(c => c.id === e.target.value);
    f.clienteId = c ? c.id : "";
    if (c) f.cliente = { nombre: c.nombre, nif: c.nif, direccion: c.direccion, email: c.email };
    vEditar(app);
  };
  const leerCabecera = () => {
    f.serie = $("#serie").value.trim() || "F"; f.fecha = $("#fecha").value || hoy();
    f.vencimiento = $("#venc").value; f.estado = $("#estado").value; f.notas = $("#notas").value;
    f.cliente = { nombre: $("#cNombre").value.trim(), nif: $("#cNif").value.trim(), direccion: $("#cDir").value.trim(), email: $("#cEmail").value.trim() };
  };
  $("#fecha").onchange = () => { leerCabecera(); f.vencimiento = sumarDias(f.fecha, E.diasVencimiento); vEditar(app); };
  $("#serie").onchange = () => { leerCabecera(); vEditar(app); };

  $("#guardarF").onclick = () => {
    leerCabecera();
    f.lineas = f.lineas.filter(l => String(l.concepto).trim() || num(l.precio));
    if (!f.cliente.nombre) { alert("Falta el nombre del cliente."); return; }
    if (!f.lineas.length) { alert("Añade al menos un concepto."); f.lineas.push({ concepto: "", cantidad: 1, precio: 0, descuento: 0, iva: E.ivaDefecto }); pintarLineas(); return; }
    f.lineas = f.lineas.map(l => ({ concepto: String(l.concepto).trim(), cantidad: num(l.cantidad), precio: num(l.precio), descuento: num(l.descuento), iva: num(l.iva) }));
    f.irpf = num(f.irpf);
    if ($("#cGuardar").checked) {
      const ex = db.clientes.find(c => c.id === f.clienteId);
      if (ex) Object.assign(ex, f.cliente); else { const c = { id: uid(), ...f.cliente, telefono: "" }; db.clientes.push(c); f.clienteId = c.id; }
    }
    if (!f.id) {
      const anio = f.fecha.slice(0, 4);
      const ultima = db.facturas.filter(x => x.serie === f.serie && x.fecha.slice(0, 4) === anio).sort((a, b) => b.numero - a.numero)[0];
      if (ultima && ultima.fecha > f.fecha && !confirm(`La factura anterior de esta serie (${codigo(ultima)}) tiene fecha posterior (${fecha(ultima.fecha)}). La numeración debe ser correlativa en el tiempo. ¿Guardar igualmente?`)) return;
      f.id = uid(); f.numero = siguienteNumero(f.serie, anio);
      delete f._para; db.facturas.push(f);
    } else {
      delete f._para; const i = db.facturas.findIndex(x => x.id === f.id); db.facturas[i] = f;
    }
    guardar(); const id = f.id; borrador = null; ir("ver", id);
  };
}

  const d = num(g.deducible) / 100;
  const cuota = r2(num(g.base) * num(g.iva) / 100);
  return { cuota, total: r2(num(g.base) + cuota), baseDed: r2(num(g.base) * d), ivaDed: r2(cuota * d) };
}

/* ================= Vista: resumen e impuestos ================= */
let anioResumen = String(new Date().getFullYear());
function impuestos(anio) {
  const fs = db.facturas.filter(f => f.fecha.slice(0, 4) === anio && f.estado !== "anulada");
  const gs = db.gastos.filter(g => g.fecha.slice(0, 4) === anio);
  const tri = iso => Math.ceil(Number(iso.slice(5, 7)) / 3);
  let acIng = 0, acGas = 0, acRet = 0, pagados = 0;
  return [1, 2, 3, 4].map(t => {
    const q = fs.filter(f => tri(f.fecha) === t).map(calcular);
    const g = gs.filter(x => tri(x.fecha) === t).map(calcGasto);
    const ivas = {};
    q.forEach(c => c.desglose.forEach(d => { ivas[d.iva] = ivas[d.iva] || { base: 0, cuota: 0 }; ivas[d.iva].base = r2(ivas[d.iva].base + d.base); ivas[d.iva].cuota = r2(ivas[d.iva].cuota + d.cuota); }));
    const S = (arr, k) => r2(arr.reduce((s, c) => s + c[k], 0));
    const x = { t, n: q.length, base: S(q, "base"), iva: S(q, "iva"), irpf: S(q, "irpf"), total: S(q, "total"), ivas,
      gastos: S(g, "baseDed"), ivaSop: S(g, "ivaDed"), nG: g.length };
    x.m303 = r2(x.iva - x.ivaSop);
    // Modelo 130 (estimación directa): acumulado desde el 1 de enero
    acIng = r2(acIng + x.base); acGas = r2(acGas + x.gastos); acRet = r2(acRet + x.irpf);
    x.rend = r2(acIng - acGas);
    x.c130 = { ing: acIng, gas: acGas, rend: x.rend, veinte: r2(Math.max(0, x.rend) * 0.2), ret: acRet, previos: pagados };
    x.m130 = r2(x.c130.veinte - acRet - pagados);
    if (x.m130 > 0) pagados = r2(pagados + x.m130);
    return x;
  });
}

/* ================= Vista: ajustes / mis datos ================= */
function descargar(nombre, contenido, tipo) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([contenido], { type: tipo }));
  a.download = nombre; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
/* ---- Importar desde Holded (Excel o CSV) ---- */
const norm = s => String(s ?? "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/\s+/g, " ").trim();
const numES = v => {
  if (typeof v === "number") return v;
  let s = String(v ?? "").replace(/[€%\s]/g, "");
  if (s.includes(",") && s.includes(".")) s = s.replace(/\./g, "");
  return num(s.replace(",", "."));
};
function columna(fila, nombres, excluir = []) {
  const claves = Object.keys(fila).filter(k => !excluir.some(x => norm(k).includes(x)));
  for (const n of nombres) { const k = claves.find(k => norm(k) === n); if (k !== undefined && String(fila[k]).trim() !== "") return String(fila[k]).trim(); }
  for (const n of nombres) { const k = claves.find(k => norm(k).includes(n)); if (k !== undefined && String(fila[k]).trim() !== "") return String(fila[k]).trim(); }
  return "";
}
function cargarXLSX() {
  if (window.XLSX) return Promise.resolve();
  return new Promise((ok, ko) => {
    const s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
    s.onload = ok; s.onerror = () => ko(new Error("Para leer archivos Excel hace falta conexión a internet. También puedes guardar el archivo como CSV."));
    document.head.appendChild(s);
  });
}
function parseCSV(texto) {
  texto = texto.replace(/^﻿/, "");
  const lineas = texto.split(/\r?\n/).filter(l => l.trim()).slice(0, 20).join("\n");
  const sep = [";", ",", "\t"].map(s => [s, lineas.split(s).length]).sort((a, b) => b[1] - a[1])[0][0];
  const filas = []; let fila = [], campo = "", comillas = false;
  for (let i = 0; i < texto.length; i++) {
    const c = texto[i];
    if (comillas) {
      if (c === '"' && texto[i + 1] === '"') { campo += '"'; i++; }
      else if (c === '"') comillas = false;
      else campo += c;
    } else if (c === '"') comillas = true;
    else if (c === sep) { fila.push(campo); campo = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && texto[i + 1] === "\n") i++; fila.push(campo); filas.push(fila); fila = []; campo = ""; }
    else campo += c;
  }
  if (campo || fila.length) { fila.push(campo); filas.push(fila); }
  return filas;
}
async function leerHoja(file) {
  let filas;
  if (/\.csv$/i.test(file.name) || file.type === "text/csv") {
    const buf = await file.arrayBuffer();
    let texto = new TextDecoder("utf-8").decode(buf);
    if (texto.includes("�")) texto = new TextDecoder("windows-1252").decode(buf);
    filas = parseCSV(texto);
  } else {
    await cargarXLSX();
    const wb = XLSX.read(await file.arrayBuffer(), { type: "array" });
    filas = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, defval: "" });
  }
  // Holded a veces pone filas de título antes de la cabecera: busca la fila que parece cabecera
  const i = filas.slice(0, 15).findIndex(r => r.some(c => ["nombre", "name", "producto", "contacto", "razon social"].includes(norm(c))));
  const cab = filas[i < 0 ? 0 : i].map(c => String(c).trim());
  return filas.slice((i < 0 ? 0 : i) + 1).filter(r => r.some(c => String(c).trim() !== "")).map(r => Object.fromEntries(cab.map((c, j) => [c || "col" + j, r[j]])));
}
async function importar(tipo, file) {
  const filas = await leerHoja(file);
  if (!filas.length) throw new Error("El archivo está vacío o no tiene el formato esperado.");
  let nuevos = 0, repetidos = 0;
  if (tipo === "clientes") {
    for (const f of filas) {
      const nombre = columna(f, ["nombre", "razon social", "name", "nombre fiscal", "empresa", "contacto"]);
      if (!nombre) continue;
      const nif = columna(f, ["nif", "cif", "nif/cif", "nif / cif", "dni", "vat", "vat number", "codigo fiscal", "id fiscal"]).toUpperCase();
      const dir = [columna(f, ["direccion", "address", "domicilio"]), [columna(f, ["codigo postal", "cp", "postal code", "zip"]), columna(f, ["poblacion", "ciudad", "localidad", "city"])].filter(Boolean).join(" "),
        columna(f, ["provincia", "province", "state"])].filter(Boolean).join(", ");
      if (db.clientes.some(c => (nif && norm(c.nif) === norm(nif)) || norm(c.nombre) === norm(nombre))) { repetidos++; continue; }
      db.clientes.push({ id: uid(), nombre, nif, direccion: dir, email: columna(f, ["email", "e-mail", "correo", "mail"]), telefono: columna(f, ["telefono", "movil", "phone", "mobile"]) });
      nuevos++;
    }
  } else {
    for (const f of filas) {
      const nombre = columna(f, ["nombre", "producto", "name", "concepto", "descripcion"]);
      if (!nombre) continue;
      const precio = numES(columna(f, ["precio", "precio venta", "precio de venta", "price", "precio unitario", "subtotal", "pvp"], ["iva", "coste", "compra", "total"]));
      let iva = numES(columna(f, ["iva", "% iva", "impuesto", "impuestos", "tax", "taxes"], ["precio", "price", "total"]));
      if (iva > 0 && iva < 1) iva = r2(iva * 100);
      if (![0, 4, 10, 21].includes(iva)) iva = db.empresa.ivaDefecto;
      if (db.productos.some(p => norm(p.nombre) === norm(nombre))) { repetidos++; continue; }
      db.productos.push({ id: uid(), nombre, precio: r2(precio), iva }); nuevos++;
    }
  }
  guardar();
  return `${nuevos} ${tipo} importados${repetidos ? `, ${repetidos} ya existían y se han omitido` : ""}.`;
}

      <p style="margin-top:18px"><b>2. Importar clientes y productos.</b> En Holded, entra en <i>Contactos</i> (o en <i>Inventario → Productos</i>) y usa <i>Exportar</i>. Después sube aquí el archivo Excel o CSV.</p>
      <div class="toolbar"><button class="btn" id="impCli">Importar contactos…</button><button class="btn" id="impProd">Importar productos…</button>
        <input type="file" id="fichH" accept=".xlsx,.xls,.csv" style="display:none"><span class="note" id="impMsg"></span></div></div>

    <div class="card"><h2>Copia de seguridad</h2>
      <p class="note">Los datos se guardan solo en este navegador y en este dispositivo. Descarga una copia con frecuencia: si borras los datos del navegador, se pierden.</p>
      <div class="toolbar"><button class="btn" id="exp">Descargar copia</button><button class="btn" id="imp">Restaurar copia…</button>
      <input type="file" id="fich" accept=".json,application/json" style="display:none"></div></div>`;
  $("#ok").onclick = () => {
    app.querySelectorAll("[data-k]").forEach(i => { const k = i.dataset.k; E[k] = ["ivaDefecto", "irpfDefecto", "diasVencimiento"].includes(k) ? num(i.value) : i.value.trim(); });
    E.serie = E.serie || "F";
    if (!E.nombre || !E.nif) { $("#msg").textContent = "El nombre y el NIF son obligatorios."; return; }
    guardar(); render(); $("#msg").textContent = "Guardado ✓";

  $("#iniOk").onclick = () => {

  $("#fichH").onchange = async e => {

}
